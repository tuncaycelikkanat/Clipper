[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gaming-ai-clipper"
version = "1.0.0"
description = "Autonomous AI-powered studio for detecting, cutting, subtitling, and titling viral short-form clips from gaming videos"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "streamlit>=1.42.0",
    "google-genai>=1.0.0",
    "openai>=1.12.0",
    "faster-whisper>=1.0.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "youtube-transcript-api>=0.6.0",
    "loguru>=0.7.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
clipper = "clipper.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
